# Publish the package to GitHub Packages when a version tag is pushed.
#
# WHY A WORKFLOW AND NOT A LOCAL `npm publish`
# --------------------------------------------
# Two reasons, both practical:
#   1. This environment is not logged in to any npm registry, and asking the
#      owner to paste a token into a chat is the wrong way to obtain one.
#   2. GitHub Actions already holds a token (GITHUB_TOKEN) with the right
#      scope, supplied by the runner. Nothing secret ever touches the repo,
#      and the publish is reproducible from a tag.
#
# USAGE
#   git tag v2.0.0 && git push origin v2.0.0
#   (or run the workflow manually from the Actions tab)
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mengxing123456789'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify the package is intact
        run: |
          # A publish that ships a broken tree is worse than no publish.
          node --check src/main/film.js
          node --check src/main/paper.js
          node --check audio/score.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json ok')"
          # The timeline must be self-consistent.
          #
          # This used to assert FRAMES === 8220, which silently became a
          # guaranteed failure the moment the film grew from 20 panels/137 s to
          # 24 panels/161 s: the tag builds for v2.0.0, v2.1.x and v2.2.x all
          # died here in ten seconds and npm never received anything newer than
          # 2.0.0. A hard-coded film length is a trap, so the check is now
          # derived from whatever the timeline actually says.
          node --input-type=module -e "
            import { FRAMES, DURATION, FPS, N_SCENES } from './src/beat/timeline.js';
            const expect = Math.round(DURATION * FPS);
            if (FRAMES !== expect) {
              console.error('FRAMES', FRAMES, '!= round(DURATION*FPS)', expect);
              process.exit(1);
            }
            if (!Number.isInteger(N_SCENES) || N_SCENES < 1) {
              console.error('bad N_SCENES', N_SCENES); process.exit(1);
            }
            console.log('timeline ok:', N_SCENES, 'panels,', FRAMES, 'frames,', DURATION, 's @', FPS, 'fps');
          "

      # Publishing must be idempotent. A tag can be moved (it was, to pick up a
      # CI fix) and the same version can also have been published from a manual
      # dispatch; npm answers both with E409 "Cannot publish over existing
      # version", which turns a perfectly fine release into a red X.
      - name: Publish
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VER is already published; nothing to do"
            exit 0
          fi
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
